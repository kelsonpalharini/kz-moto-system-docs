      minLength: 12
      maxLength: 256
      description: "De 12 a 256 caracteres."
    Timezone:
      type: string
      maxLength: 64
      description: "Fuso horário IANA."
      examples: [America/Sao_Paulo]
    NextCursor:
      type: [string, "null"]
      description: "Cursor da próxima página, ou null na última página."
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {$ref: "#/components/schemas/Email"}
        password: {type: string, minLength: 1, maxLength: 1024}
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: {type: string, maxLength: 128}
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {$ref: "#/components/schemas/Email"}
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token: {type: string, maxLength: 128, description: "Token do fragmento da
            URL do link de redefinição."}
        new_password: {$ref: "#/components/schemas/NewPassword"}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, maxLength: 1024}
        new_password: {$ref: "#/components/schemas/NewPassword"}
    TokenResponse:
      type: object
      additionalProperties: false
      required: [token_type, access_token, access_token_expires_at, refresh_token,
        refresh_token_expires_at]
      properties:
        token_type: {const: Bearer}
        access_token: {type: string, pattern: "^kzat_[A-Za-z0-9_-]{43}$"}
        access_token_expires_at: {type: string, format: date-time}
        refresh_token: {type: string, pattern: "^kzrt_[A-Za-z0-9_-]{43}$"}
        refresh_token_expires_at: {type: string, format: date-time}
    User:
      type: object
      additionalProperties: false
      required: [id, email, full_name, phone, platform_admin]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        full_name: {type: string}
        phone: {type: [string, "null"]}
        platform_admin: {type: boolean}
    Session:
      type: object
      additionalProperties: false
      required: [id, created_at, last_seen_at, expires_at, ip, user_agent, current]
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        ip: {type: [string, "null"]}
        user_agent: {type: [string, "null"]}
        current: {type: boolean, description: "True para a sessão que fez esta requisição."}
    SessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Session"}
    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, timezone, created_at, license_plan, license_expires_on]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        status: {type: string, enum: [active, suspended, closed]}
        timezone: {$ref: "#/components/schemas/Timezone"}
        created_at: {type: string, format: date-time}
        license_plan: {$ref: "#/components/schemas/LicensePlan"}
        license_expires_on: {type: [string, "null"], format: date, description: "null
            = sem vencimento."}
    LicensePlan:
      type: string
      enum: [trial, basic, pro, enterprise]
      description: "Plano comercial; define os módulos opcionais que a oficina pode
        ligar."
    PlatformDashboard:
      type: object
      additionalProperties: false
      required: [since, days, tenants, mrr]
      properties:
        since: {type: string, format: date}
        days: {type: integer}
        mrr: {type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$", description: "Platform
            monthly recurring revenue."}
        tenants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tenant, sales_total, sales_count, work_orders, active_members,
              daily_sales, locations, monthly_revenue]
            properties:
              tenant: {$ref: "#/components/schemas/Tenant"}
              sales_total: {type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$"}
              sales_count: {type: integer}
              work_orders: {type: integer}
              active_members: {type: integer}
              locations: {type: integer, description: "Active locations."}
              monthly_revenue: {type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$", description: "What
                  the tenant pays per month: plan price + extra locations; 0 for trial,
                  expired or inactive."}
              daily_sales:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [day, total]
                  properties:
                    day: {type: string, format: date}
                    total: {type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$"}
    TenantList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Tenant"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    UserTenant:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, timezone, membership_id, support_until]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        status: {type: string, enum: [active, suspended, closed]}
        timezone: {$ref: "#/components/schemas/Timezone"}
        membership_id: {type: [string, "null"], format: uuid, description: "null during
            a platform support session."}
        support_until: {type: [string, "null"], format: date-time, description: "Read-only
            platform support access ends at this time."}
    UserTenantList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/UserTenant"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    UpdateTenantRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 2, maxLength: 180}
        timezone: {$ref: "#/components/schemas/Timezone"}
    RoleRef:
      type: object
      additionalProperties: false
      required: [id, code]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
    Member:
      type: object
      additionalProperties: false
      required: [id, user_id, email, full_name, status, joined_at, roles]
      properties:
        id: {type: string, format: uuid, description: "ID do vínculo."}
        user_id: {type: string, format: uuid}
        email: {type: string}
        full_name: {type: string}
        status: {type: string, enum: [active, suspended]}
        joined_at: {type: string, format: date-time}
        roles:
          type: array
          items: {$ref: "#/components/schemas/RoleRef"}
    MemberList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Member"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [active, suspended, removed]}
    ReplaceRolesRequest:
      type: object
      additionalProperties: false
      required: [role_ids]
      properties:
        role_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid}
    Role:
      type: object
      additionalProperties: false
      required: [id, code, name, is_system, permissions]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        is_system: {type: boolean}
        permissions:
          type: array
          items: {type: string}
    RoleList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Role"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role_id, role_code, status, expires_at, created_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        role_id: {type: string, format: uuid}
        role_code: {type: string}
        status: {type: string, enum: [pending, accepted, revoked]}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    InvitationList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Invitation"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    InviteRequest:
      type: object
      additionalProperties: false
      required: [email, role_id]
      properties:
        email: {$ref: "#/components/schemas/Email"}
        role_id: {type: string, format: uuid}
    InvitationLink:
      type: object
      additionalProperties: false
      required: [tenant_id, token]
      description: "Os dois valores vêm do fragmento da URL do link de convite."
      properties:
        tenant_id: {type: string, format: uuid}
        token: {type: string, maxLength: 128}
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, token]
      properties:
        tenant_id: {type: string, format: uuid}
        token: {type: string, maxLength: 128}
        full_name: {type: string, minLength: 1, maxLength: 180, description: "Obrigatório
            ao criar uma conta."}
        password: {$ref: "#/components/schemas/NewPassword"}
    InvitationPreview:
      type: object
      additionalProperties: false
      required: [tenant_name, email, role_code, expires_at, account_exists]
      properties:
        tenant_name: {type: string}
        email: {type: string}
        role_code: {type: string}
        expires_at: {type: string, format: date-time}
        account_exists: {type: boolean, description: "Quando true, o convidado precisa
            entrar antes de aceitar.", log in before accepting.: ''}
    AcceptInvitationResponse:
      type: object
      additionalProperties: false
      required: [tenant_id, membership_id, tokens]
      properties:
        tenant_id: {type: string, format: uuid}
        membership_id: {type: string, format: uuid}
        tokens:
          oneOf:
            - $ref: "#/components/schemas/TokenResponse"
            - type: "null"
    AuditLog:
      type: object
      additionalProperties: false
      required: [id, actor_user_id, actor_name, action, entity_type, entity_id, request_id,
        metadata, created_at]
      properties:
        id: {type: string, format: uuid}
        actor_user_id: {type: [string, "null"], format: uuid}
        actor_name: {type: [string, "null"]}
        action: {type: string, examples: [membership.roles_changed]}
        entity_type: {type: string}
        entity_id: {type: [string, "null"], format: uuid}
        request_id: {type: [string, "null"]}
        metadata: {type: object}
        created_at: {type: string, format: date-time}
    AuditLogList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AuditLog"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [name, slug, owner_email]
      properties:
        name: {type: string, minLength: 2, maxLength: 180}
        slug: {type: string, minLength: 2, maxLength: 63, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"}
        timezone: {$ref: "#/components/schemas/Timezone"}
        owner_email: {$ref: "#/components/schemas/Email"}
    CreateTenantResponse:
      type: object
      additionalProperties: false
      required: [tenant, owner_invitation]
      properties:
        tenant: {$ref: "#/components/schemas/Tenant"}
        owner_invitation: {$ref: "#/components/schemas/Invitation"}
    PlatformUpdateTenantRequest:
      type: object
      additionalProperties: false
      properties:
        status: {type: string, enum: [active, suspended, closed]}
        license_plan: {$ref: "#/components/schemas/LicensePlan"}
        license_expires_on: {type: [string, "null"], format: date, description: "Enviado
            junto com license_plan; null = sem vencimento."}
