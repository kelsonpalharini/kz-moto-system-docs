  schemas:
    MyMembership:
      type: object
      additionalProperties: false
      required: [tenant_id, user_id, membership_id, roles, permissions, access_all_locations,
        locations, features, customer_sharing, can_offer_store_credit, license_plan,
        licensed_features, support_until]
      properties:
        tenant_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        membership_id: {type: string, format: uuid}
        roles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, name]
            properties:
              code: {type: string}
              name: {type: string}
        permissions: {type: array, items: {type: string}}
        access_all_locations: {type: boolean}
        locations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, code, name]
            properties:
              id: {type: string, format: uuid}
              code: {type: string}
              name: {type: string}
        features: {type: object, additionalProperties: {type: boolean}}
        customer_sharing: {$ref: "#/components/schemas/CustomerSharing"}
        license_plan: {$ref: "#/components/schemas/LicensePlan"}
        licensed_features: {type: array, items: {type: string}, description: "Módulos
            opcionais que o plano da licença inclui; features já vem limitado a eles."}
        can_offer_store_credit: {type: boolean, description: "Um dos perfis do membro
            está em store_credit_roles da oficina: o PDV pode oferecer crediário."}
        support_until: {type: [string, "null"], format: date-time, description: "Set
            during a platform administrator's read-only support access (membership_id
            is the nil UUID then)."}
    ShareVehicle:
      type: object
      additionalProperties: false
      required: [id, plate, make, model, model_year]
      properties:
        id: {type: string, format: uuid}
        plate: {type: [string, "null"]}
        make: {type: [string, "null"]}
        model: {type: [string, "null"]}
        model_year: {type: [integer, "null"]}
    CustomerShareRequest:
      type: object
      additionalProperties: false
      required: [target_slug]
      properties:
        target_slug: {type: string, maxLength: 63}
        scope: {type: string, enum: [profile, profile_and_history], default: profile_and_history}
        vehicle_ids: {type: [array, "null"], maxItems: 20, items: {type: string, format: uuid}}
    CustomerShare:
      type: object
      additionalProperties: false
      required: [id, party_id, target_tenant_id, target_name, scope, status, email,
        expires_at, decided_at, revoked_at, revoked_source, created_at, vehicles]
      properties:
        id: {type: string, format: uuid}
        party_id: {type: string, format: uuid}
        target_tenant_id: {type: string, format: uuid}
        target_name: {type: [string, "null"]}
        scope: {type: string, enum: [profile, profile_and_history]}
        status: {type: string, enum: [pending, consented, rejected, expired, revoked]}
        email: {type: string}
        expires_at: {type: string, format: date-time}
        decided_at: {type: [string, "null"], format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        revoked_source: {type: [string, "null"], enum: [customer, store, null]}
        created_at: {type: string, format: date-time}
        vehicles: {type: array, items: {$ref: "#/components/schemas/ShareVehicle"}}
    CustomerShareList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CustomerShare"}}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    CustomerShareLink:
      type: object
      additionalProperties: false
