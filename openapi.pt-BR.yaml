openapi: 3.1.0
info:
  title: "API do KZ Moto System"
  version: 0.28.0
  summary: Multi-tenant management API for automotive repair shops.
  description: |
    API REST consumida diretamente pelo frontend web (sem BFF).

    Convenções:
    - Os endpoints de negócio ficam em `/api/v1`; as sondas operacionais ficam na raiz.
    - Corpos JSON em UTF-8, datas e horas ISO 8601 em UTC, identificadores UUID e campos em snake_case.
    - Toda resposta traz `X-Request-ID`; o cliente pode enviar um válido para correlacionar novas tentativas.
    - Erros sempre usam o envelope `Error` e nunca expõem SQL, stack traces ou segredos.
    - Listas retornam `{items, next_cursor}`; envie `next_cursor` de volta como `?cursor=` para a próxima página.

    Autenticação:
    - `POST /api/v1/auth/login` devolve um token de acesso opaco (15 minutos) e um token de renovação.
    - Envie `Authorization: Bearer <access_token>` nos endpoints protegidos.
    - `POST /api/v1/auth/refresh` troca os dois tokens. Cada token de renovação funciona uma vez: reutilizá-lo revoga a sessão inteira, então o cliente deve serializar as renovações.
    - Guarde os tokens em memória (no máximo em `sessionStorage`), nunca em `localStorage`.

    Tenants (oficinas):
    - Os tenants são criados por administradores da plataforma; os donos entram por convite.
    - `{tenantID}` no caminho apenas seleciona o tenant. O servidor confere, a cada requisição, um vínculo ativo e a permissão exigida; quem não é membro recebe 404.
servers:
  - url: https://kz-moto-api-hom.onrender.com
    description: "Homologação (hom). No plano gratuito, a primeira requisição após
      15 minutos sem uso leva cerca de 1 minuto."
  - url: http://localhost:8080
    description: "Desenvolvimento local (make run ou make docker-up)"
