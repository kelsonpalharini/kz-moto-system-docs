      summary: "Histórico de manutenção compartilhado por outras empresas para um
        veículo"
      description: "Exige `vehicles.read`. Cópia somente leitura feita quando o cliente
        consentiu; removida se o compartilhamento for revogado."
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - {name: vehicleID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedServiceRecordList"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/public/customer-shares/inspect:
    post:
      operationId: inspectCustomerShare
      tags: [customer-sharing]
      summary: "Página de consentimento: o que será compartilhado e com quem"
      description: "Público (link enviado ao cliente); com limite de requisições."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerShareLink"
      responses:
        "200":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerShareView"
        "400": {$ref: "#/components/responses/BadRequest"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/public/customer-shares/decide:
    post:
      operationId: decideCustomerShare
      tags: [customer-sharing]
      summary: "Aceitar, recusar ou revogar depois o compartilhamento"
      description: "Público (link enviado ao cliente); com limite de requisições.
        Aceitar copia os dados para a loja de destino; revogar remove o histórico
        copiado."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerShareDecision"
      responses:
        "200":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerShareView"
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "410": {$ref: "#/components/responses/Gone"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/tenants/{tenantID}/me:
    get:
      operationId: getMyMembership
      tags: [tenants]
      summary: "O que o usuário pode fazer na oficina"
      description: "Qualquer membro. Perfis, códigos de permissão, lojas acessíveis,
        módulos ativos e a política de compartilhamento de clientes, para o frontend
        montar menus e esconder ações (a API continua aplicando todas as regras)."
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMembership"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
