        make_id: { type: [string, "null"], format: uuid }
        model_id: { type: [string, "null"], format: uuid }
        variant_id: { type: [string, "null"], format: uuid }
        make_text: { type: [string, "null"] }
        model_text: { type: [string, "null"] }
        chassis_number: { type: [string, "null"] }
        renavam: { type: [string, "null"] }
        engine_number: { type: [string, "null"] }
        manufacture_year: { type: [integer, "null"] }
        model_year: { type: [integer, "null"] }
        color: { type: [string, "null"] }
        fuel_type: { type: [string, "null"] }
        engine_cc: { type: [integer, "null"] }
        odometer_km: { type: [integer, "null"] }
        notes: { type: [string, "null"] }
        status: { type: string }
    Plate:
      type: object
      additionalProperties: false
      required: [id, plate, valid_from, valid_to, current]
      properties:
        id: { type: string, format: uuid }
        plate: { type: string }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, "null"], format: date }
        current: { type: boolean }
    PlateList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Plate" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    PlateRequest:
      type: object
      additionalProperties: false
