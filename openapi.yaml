      description: "Requires `cash.adjust`."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashSession"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tenants/{tenantID}/sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: "Sales"
      description: "Requires `sales.read`."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/SaleStatus"
        - $ref: "#/components/parameters/LocationFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: createSale
      tags: [sales]
      summary: "Open a draft sale"
      description: "Requires `sales.create`. Numbered per location (e.g. SP01-VD-000001)."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleRequest"
      responses:
        "201":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/tenants/{tenantID}/sales/{saleID}:
    get:
      operationId: getSale
      tags: [sales]
      summary: "A sale with items and payments"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/SaleID"
      responses:
        "200":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tenants/{tenantID}/sales/{saleID}/items:
    post:
      operationId: addSaleItem
      tags: [sales]
      summary: "Add a product line to a draft"
      description: "Prices default to the product. Discounts need `sales.discount` up to the tenant cap (percent of the line) and `sales.discount_unlimited` above it."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/SaleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleItemRequest"
      responses:
        "201":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/tenants/{tenantID}/sales/{saleID}/items/{itemID}:
    patch:
      operationId: updateSaleItem
      tags: [sales]
      summary: "Change quantity, price or discount of a draft line"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/SaleID"
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleItemPatchRequest"
      responses:
        "200":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: removeSaleItem
      tags: [sales]
      summary: "Remove a draft line"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/SaleID"
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/tenants/{tenantID}/sales/{saleID}/checkout:
    post:
      operationId: checkoutSale
      tags: [sales]
      summary: "Pay and complete a draft sale atomically"
      description: "Requires an `Idempotency-Key`; retrying returns the completed sale. Payments must add up to the total. Stock leaves at average cost; cash (needs an open session) and PIX post to the ledger; card installments become receivables from the acquirer net of its fee (D+1 debit, D+30 per credit installment); store credit becomes monthly receivables from the customer."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/SaleID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/tenants/{tenantID}/sales/{saleID}/cancel:
    post:
      operationId: cancelSale
      tags: [sales]
      summary: "Cancel a draft or reverse a completed sale"
      description: "Completed sales need `sales.cancel`: stock returns, cash (through an open session of the same cash account) and PIX are reversed, and receivables are cancelled; refused when a receivable has payments."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/SaleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleCancelRequest"
      responses:
        "200":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque access token (`kzat_…`) returned by login or refresh. Valid for 15 minutes.
  headers:
    RequestID:
      description: Request correlation ID, generated by the server unless the client sent a well-formed one.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{8,64}$"
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  parameters:
    RegisterID:
      name: registerID
      in: path
      required: true
      schema: { type: string, format: uuid }
    SaleID:
      name: saleID
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegisterFilter:
      name: register_id
      in: query
      schema: { type: string, format: uuid }
    SessionStatus:
      name: status
      in: query
      schema: { type: string, enum: [open, closed] }
    SaleStatus:
      name: status
      in: query
      schema: { type: string, enum: [draft, completed, cancelled] }
    AccountID:
      name: accountID
      in: path
      required: true
      schema: { type: string, format: uuid }
    FinCategoryID:
      name: categoryID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransactionID:
      name: transactionID
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentID:
      name: paymentID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TitleIDPayable:
      name: payableID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TitleIDReceivable:
      name: receivableID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountFilter:
      name: account_id
      in: query
      schema: { type: string, format: uuid }
    OriginIDFilter:
      name: origin_id
      in: query
      schema: { type: string, format: uuid }
    FromDate:
      name: from
      in: query
      schema: { type: string, format: date }
    ToDate:
      name: to
      in: query
      schema: { type: string, format: date }
    TitleStatus:
      name: status
      in: query
      schema: { type: string, enum: [open, partially_paid, paid, cancelled] }
    OriginTypeFilter:
      name: origin_type
      in: query
      schema: { type: string, enum: [manual, work_order, sale] }
    OrderID:
      name: orderID
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvoiceID:
      name: invoiceID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportLocation:
      name: location_id
      in: query
      required: true
      description: Receiving location.
      schema: { type: string, format: uuid }
    PayableInvoiceFilter:
      name: supplier_invoice_id
      in: query
      schema: { type: string, format: uuid }
    DueBefore:
      name: due_before
      in: query
      schema: { type: string, format: date }
    PurchaseOrderStatus:
      name: status
      in: query
      schema: { type: string, enum: [draft, sent, partially_received, received, cancelled] }
    InvoiceStatus:
      name: status
      in: query
      schema: { type: string, enum: [draft, confirmed, cancelled] }
    PayableStatus:
      name: status
      in: query
      schema: { type: string, enum: [open, paid, cancelled] }
    CategoryID:
      name: categoryID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductID:
      name: productID
      in: path
      required: true
      schema: { type: string, format: uuid }
    StockLocationID:
      name: stockLocationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransferID:
      name: transferID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryFilter:
      name: category_id
      in: query
      schema: { type: string, format: uuid }
    ProductFilter:
      name: product_id
      in: query
      schema: { type: string, format: uuid }
    StockLocationFilter:
      name: stock_location_id
      in: query
      schema: { type: string, format: uuid }
    ItemKindFilter:
      name: item_kind
      in: query
      schema: { type: string, enum: [part, supply, accessory, service, fee] }
    IncludeEmpty:
      name: include_empty
      in: query
      description: Include zero balances.
      schema: { type: boolean }
    TransferStatus:
      name: status
      in: query
      schema: { type: string, enum: [draft, in_transit, received, cancelled] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key (e.g. a UUID) that makes the request safe to retry.
      schema: { type: string, minLength: 8, maxLength: 128 }
    AppointmentID:
      name: appointmentID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateID:
      name: templateID
      in: path
      required: true
      schema: { type: string, format: uuid }
    InspectionID:
      name: inspectionID
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkOrderID:
      name: workOrderID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemID:
      name: itemID
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationFilter:
      name: location_id
      in: query
      description: Only this location.
      schema: { type: string, format: uuid }
    VehicleFilter:
      name: vehicle_id
      in: query
      description: Only this vehicle.
      schema: { type: string, format: uuid }
    WorkOrderFilter:
      name: work_order_id
      in: query
      description: Only this work order.
      schema: { type: string, format: uuid }
    PartyFilter:
      name: party_id
      in: query
      description: Only this customer.
      schema: { type: string, format: uuid }
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
    AppointmentStatus:
      name: status
      in: query
      schema: { type: string, enum: [scheduled, confirmed, checked_in, completed, no_show, cancelled] }
    WorkOrderStatus:
      name: status
      in: query
      schema: { type: string, enum: [draft, awaiting_approval, approved, in_progress, waiting_parts, completed, delivered, cancelled] }
    LegalEntityID:
      name: legalEntityID
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationID:
      name: locationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    PartyID:
      name: partyID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactID:
      name: contactID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AddressID:
      name: addressID
      in: path
      required: true
      schema: { type: string, format: uuid }
    VehicleID:
      name: vehicleID
      in: path
      required: true
      schema: { type: string, format: uuid }
    MakeID:
      name: makeID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModelID:
      name: modelID
      in: path
      required: true
      schema: { type: string, format: uuid }
    VariantID:
      name: variantID
      in: path
      required: true
      schema: { type: string, format: uuid }
    Query:
      name: q
      in: query
      description: Search text.
      schema: { type: string, maxLength: 100 }
    PartyStatus:
      name: status
      in: query
      schema: { type: string, enum: [active, inactive, blocked] }
    IncludeArchived:
      name: include_archived
      in: query
      description: Include archived or inactive entries.
      schema: { type: boolean }
    VehicleType:
      name: vehicle_type
      in: query
      schema: { $ref: "#/components/schemas/VehicleType" }
    TenantID:
      name: tenantID
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipID:
      name: membershipID
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionID:
      name: sessionID
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`.
      schema: { type: string, maxLength: 200 }
  responses:
    NoContent:
      description: Done.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    Tokens:
      description: A new access/refresh token pair.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TokenResponse"
    Tenant:
      description: The tenant.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Tenant"
    Member:
      description: The member after the change.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Member"
    Invitation:
      description: The invitation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Invitation"
    InvitationAccepted:
      description: The caller is now a member. `tokens` is present when a new account was created.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AcceptInvitationResponse"
    BadRequest:
      description: "Malformed JSON, unknown fields, or wrong field types (`invalid_json`)."
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "`authentication_required`, `invalid_token`, `invalid_credentials` or `login_required`."
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "`insufficient_permissions`, `membership_inactive`, `tenant_inactive`, `invitation_email_mismatch` or `forbidden`."
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "`last_owner`, `already_member` or `slug_taken`."
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: "`invitation_gone`: the invitation expired, was revoked, or was already used."
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The request body exceeds the size limit.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The request body is not `application/json`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: "`validation_failed`; `details` lists each invalid field."
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: "`rate_limited`."
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    TenantSettings:
      type: object
      additionalProperties: false
      required: [max_discount_pct, cash_difference_alert]
      properties:
        max_discount_pct: { type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$" }
        cash_difference_alert: { type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$" }
    TenantSettingsPatchRequest:
      type: object
      additionalProperties: false
      properties:
        max_discount_pct: { type: [string, number] }
        cash_difference_alert: { type: [string, number] }
    CashRegister:
      type: object
      additionalProperties: false
      required: [id, location_id, name, account_id, active]
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        name: { type: string }
        account_id: { type: string, format: uuid }
        active: { type: boolean }
        open_session_id: { type: [string, "null"], format: uuid }
    CashRegisterList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CashRegister" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    CashRegisterRequest:
      type: object
      additionalProperties: false
      required: [location_id, name, account_id]
      properties:
        location_id: { type: string, format: uuid }
        name: { type: string }
        account_id: { type: string, format: uuid }
