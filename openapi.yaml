      properties:
        id: { type: string, format: uuid }
        party_id: { type: string, format: uuid }
        party_name: { type: string }
        relationship: { type: string, enum: [owner, lessee, driver, fleet_manager] }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, "null"], format: date }
        current: { type: boolean }
        notes: { type: [string, "null"] }
    OwnershipList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Ownership" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    OwnershipRequest:
      type: object
      additionalProperties: false
      required: [party_id, relationship]
      properties:
        party_id: { type: string, format: uuid }
        relationship: { type: string, enum: [owner, lessee, driver, fleet_manager] }
        valid_from: { type: string, format: date }
        notes: { type: [string, "null"] }
    LivenessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ready
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              pattern: "^[a-z][a-z0-9_]*$"
              description: Stable, machine-readable error code.
              examples: [not_found, invalid_credentials, last_owner]
            message:
              type: string
              description: Safe, human-readable description. Do not parse.
            request_id:
              type: string
              description: Same value as the X-Request-ID response header.
            details:
              type: array
              items:
                $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string
    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
    NewPassword:
      type: string
      minLength: 12
      maxLength: 256
      description: 12 to 256 characters.
    Timezone:
      type: string
      maxLength: 64
      description: IANA time zone.
      examples: [America/Sao_Paulo]
    NextCursor:
      type: [string, "null"]
      description: Cursor for the next page, or null on the last page.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 1024 }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, maxLength: 128 }
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
