      type: object
      additionalProperties: false
      required: [token_type, access_token, access_token_expires_at, refresh_token, refresh_token_expires_at]
      properties:
        token_type: { const: Bearer }
        access_token: { type: string, pattern: "^kzat_[A-Za-z0-9_-]{43}$" }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string, pattern: "^kzrt_[A-Za-z0-9_-]{43}$" }
        refresh_token_expires_at: { type: string, format: date-time }
