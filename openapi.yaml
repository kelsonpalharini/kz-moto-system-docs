openapi: 3.1.0
info:
  title: KZ Moto System API
  version: 0.8.0
  summary: Multi-tenant management API for automotive repair shops.
  description: |
    REST API consumed directly by the web frontend (no BFF).

    Conventions:
    - Business endpoints live under `/api/v1`; operational probes live at the root.
    - JSON UTF-8 bodies, ISO 8601 timestamps in UTC, UUID identifiers, snake_case fields.
    - Every response carries `X-Request-ID`; clients may send a well-formed one to correlate retries.
    - Errors always use the `Error` envelope and never expose SQL, stack traces, or secrets.
    - Lists return `{items, next_cursor}`; pass `next_cursor` back as `?cursor=` for the next page.

    Authentication:
    - `POST /api/v1/auth/login` returns an opaque access token (15 minutes) and a refresh token.
    - Send `Authorization: Bearer <access_token>` on protected endpoints.
    - `POST /api/v1/auth/refresh` rotates both tokens. Each refresh token works once: reusing one
      revokes the whole session, so clients must serialize refreshes.
    - Keep tokens in memory (and at most `sessionStorage`); never in `localStorage`.

    Tenancy:
    - Tenants are provisioned by platform administrators; owners join through an invitation.
    - `{tenantID}` in a path only selects a tenant. The server verifies an active membership and
      the required permission on every request; non-members receive 404.
servers:
  - url: http://localhost:8080
    description: Local development
security: []
tags:
  - name: operations
    description: Liveness and readiness probes for orchestrators and load balancers.
  - name: auth
    description: Login, sessions, and passwords.
  - name: tenants
    description: Tenants the caller belongs to, members, roles, and audit log.
  - name: invitations
    description: Inviting people to a tenant and accepting invitations.
  - name: platform
    description: Platform administration (tenant provisioning). Platform administrators only.
  - name: organization
    description: Legal entities (CNPJ), locations, and per-location access.
  - name: customers
    description: Customers (people and companies).
  - name: suppliers
    description: Suppliers.
  - name: parties
    description: Contacts and addresses shared by customers and suppliers.
  - name: vehicles
    description: Vehicles, plate history, and owners/drivers.
  - name: vehicle-catalog
    description: Global make/model/variant catalogue (read-only for tenants).
  - name: appointments
    description: Per-location schedule with capacity control.
  - name: inspections
    description: Versioned checklists and vehicle inspections.
  - name: work-orders
    description: Work orders and estimates, approvals, technicians and labor.
  - name: public
    description: Customer-facing endpoints without login (approval links).
  - name: catalog
    description: Parts and services catalogue.
  - name: inventory
    description: Storage places, balances, ledger, adjustments and transfers.
  - name: purchasing
    description: Purchase orders, NF-e import, review and confirmation.
  - name: finance
    description: Accounts, categories, ledger, transfers, payables and receivables.
  - name: settings
    description: Tenant business settings.
  - name: cash
    description: Cash registers and sessions (blind closing).
  - name: sales
    description: Point of sale, checkout and cancellation.
paths:
  /healthz:
    get:
      operationId: getLiveness
      tags: [operations]
      summary: Liveness probe
      description: Reports that the process is running. Dependencies are not checked.
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"
  /readyz:
    get:
      operationId: getReadiness
      tags: [operations]
      summary: Readiness probe
      description: Reports whether the process can serve traffic. Checks the database within a short timeout.
      responses:
        "200":
          description: The process is ready to serve traffic.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with e-mail and password
      description: |
        Unknown e-mails, wrong passwords, disabled and temporarily locked accounts all return the
        same `invalid_credentials` error. Ten consecutive failures lock the account for 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      tags: [auth]
      summary: Rotate the access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      security: [{ bearerAuth: [] }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      tags: [auth]
      summary: End every session of the caller, including the current one
      security: [{ bearerAuth: [] }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: E-mail a password reset link
      description: Always answers 202, whether or not the address has an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Accepted. If the address has an active account, a link valid for one hour was sent.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Choose a new password with a reset token
      description: Signs out every session of the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/password/change:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the caller's password
      description: Signs out every other session.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's account.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: The caller's active sessions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active sessions, most recently used first.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/sessions/{sessionID}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: End one of the caller's sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tenants:
    get:
      operationId: listMyTenants
      tags: [tenants]
      summary: Tenants where the caller has an active membership
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's tenants, by name.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTenantList"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/tenants/{tenantID}:
    parameters:
      - $ref: "#/components/parameters/TenantID"
    get:
      operationId: getTenant
      tags: [tenants]
      summary: A tenant the caller belongs to
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Change the tenant name or time zone
      description: "Requires `tenant.manage`."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200": { $ref: "#/components/responses/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/tenants/{tenantID}/members:
    get:
      operationId: listMembers
      tags: [tenants]
      summary: Members of the tenant
      description: "Requires `users.read`. Removed members are omitted."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of members ordered by join date.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/tenants/{tenantID}/members/{membershipID}:
    patch:
      operationId: updateMemberStatus
      tags: [tenants]
      summary: Suspend, reactivate or remove a member
      description: |
        Requires `users.disable` and every permission the member holds. The tenant must keep at
        least one active owner (`409 last_owner`). Removing returns 204.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/MembershipID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200": { $ref: "#/components/responses/Member" }
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/tenants/{tenantID}/members/{membershipID}/roles:
    put:
      operationId: replaceMemberRoles
      tags: [tenants]
      summary: Replace a member's roles
      description: |
        Requires `users.update` and every permission of the member's current and new roles. The
        tenant must keep at least one active owner (`409 last_owner`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/MembershipID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRolesRequest"
      responses:
        "200": { $ref: "#/components/responses/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/tenants/{tenantID}/roles:
    get:
      operationId: listRoles
      tags: [tenants]
      summary: Roles of the tenant and their permissions
      description: "Requires `users.read`."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: The tenant's roles.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tenants/{tenantID}/invitations:
    parameters:
      - $ref: "#/components/parameters/TenantID"
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: Pending invitations of the tenant
      description: "Requires `users.read`."
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Pending invitations, newest first.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Invite someone to the tenant
      description: |
        Requires `users.invite` and every permission of the role. Replaces a pending invitation
        for the same address. The invitee receives a link valid for 7 days.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201": { $ref: "#/components/responses/Invitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/tenants/{tenantID}/invitations/{invitationID}:
    delete:
      operationId: revokeInvitation
      tags: [invitations]
      summary: Revoke a pending invitation
      description: "Requires `users.invite`."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tenants/{tenantID}/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [tenants]
      summary: The tenant's audit log
      description: "Requires `audit.read`."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of audit entries, newest first.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/invitations/inspect:
    post:
      operationId: inspectInvitation
      tags: [invitations]
      summary: Check an invitation link before accepting it
      description: Tells the invitee which tenant invited them and whether they must log in first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationLink"
      responses:
        "200":
          description: The invitation is valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept an invitation
      description: |
        With a bearer token, the caller's e-mail must match the invitation and the response is 200.
        Without one, `full_name` and `password` create the account (the link proves ownership of
        the address) and the response is 201 with tokens for the new session. If an account
        already exists for the address, the response is `401 login_required`.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200": { $ref: "#/components/responses/InvitationAccepted" }
        "201": { $ref: "#/components/responses/InvitationAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/platform/tenants:
    get:
      operationId: platformListTenants
      tags: [platform]
      summary: Every tenant, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tenants.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: platformCreateTenant
      tags: [platform]
      summary: Provision a tenant and invite its owner
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: The tenant was created and the owner invitation sent.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTenantResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/platform/tenants/{tenantID}:
    patch:
      operationId: platformUpdateTenant
      tags: [platform]
      summary: Suspend, reactivate or close a tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformUpdateTenantRequest"
      responses:
        "200": { $ref: "#/components/responses/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/tenants/{tenantID}/legal-entities:
    get:
      operationId: listLegalEntities
      tags: [organization]
      summary: Legal entities (CNPJs) of the tenant
      description: "Requires `organization.read`."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: createLegalEntity
      tags: [organization]
